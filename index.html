<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>آریا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f5;--panel:#fff;--ink:#0f1b2d;--mute:#5d6b7c;--line:#d3dde7;--accent:#0e8f86;--accent-ink:#fff;--me:#0f1b2d;--me-ink:#fff;--bot:#fff;--err:#b4342d}
@media(prefers-color-scheme:dark){:root{--bg:#0b1420;--panel:#122033;--ink:#e8eef5;--mute:#8fa1b5;--line:#233750;--accent:#2fc4b8;--accent-ink:#06201d;--me:#2fc4b8;--me-ink:#06201d;--bot:#122033;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;font-weight:800;margin:0;flex:0 0 auto}
header select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.ic{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:15px}
.ic:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:280px;line-height:1.9}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.9;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.me{align-self:flex-start;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-end;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.bot.err{color:var(--err)}
details{margin-top:8px;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
details summary{cursor:pointer;color:var(--mute)}
details p{margin:6px 0;white-space:pre-wrap}
form{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;font-size:15px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-height:120px}
.send{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.send:disabled{opacity:.5}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-weight:600;margin:12px 0 6px}
dialog input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
dialog .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
dialog .row button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
dialog .row .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#pvbox{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#pvbox[hidden]{display:none}
#pvbox button{margin:8px;align-self:flex-start}
#pv{flex:1;border:0;background:#fff;width:100%}
#flist{margin-top:10px;max-height:30vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.9}
#flist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line)}
#flist div:last-child{border-bottom:0}
#flist span{color:var(--err);flex:0 0 auto}
dialog{max-height:90vh;overflow-y:auto}
#mlist{margin-top:10px;max-height:38vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;direction:ltr;text-align:left;font-size:13px;line-height:1.9}
#mlist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line)}
#mlist div:last-child{border-bottom:0}
#mlist span{color:var(--mute);flex:0 0 auto}
.hint{color:var(--mute);font-size:13px;line-height:1.8;margin:6px 0 0}
@media(prefers-reduced-motion:no-preference){.msg{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header>
  <h1>آریا</h1>
  <select id="mode" aria-label="انتخاب مدل"></select>
  <button class="ic" id="cfg" aria-label="تنظیمات">⚙️</button>
  <button class="ic" id="clr" aria-label="گفتگوی جدید">🗑️</button>
</header>
<div id="log"></div>
<form id="f">
  <textarea id="q" rows="1" placeholder="بپرس..." aria-label="پیام"></textarea>
  <button class="send" id="s" type="submit">ارسال</button>
</form>

<div id="pvbox" hidden>
  <button class="ic" id="pvx">✕ بستن</button>
  <iframe id="pv" sandbox="allow-scripts allow-forms allow-modals" title="پیش‌نمایش پروژه"></iframe>
</div>

<dialog id="dlg">
  <strong>تنظیمات</strong>
  <label for="key">کلید API اُپن‌روتر</label>
  <input id="key" type="password" autocomplete="off" placeholder="sk-or-...">
  <p class="hint">کلید فقط توی همین مرورگر ذخیره میشه و جای دیگه‌ای فرستاده نمیشه (به جز خود اُپن‌روتر).</p>
  <label for="gh">توکن GitHub (برای حافظه)</label>
  <input id="gh" type="password" autocomplete="off" placeholder="github_pat_...">
  <label for="repo">ریپوی حافظه</label>
  <input id="repo" autocomplete="off" placeholder="username/Bihooshe-memory">
  <p class="hint">تو چت بنویس «یادت باشه ...» تا آریا ذخیره کنه.</p>
  <p class="hint" id="mcount"></p>
  <p class="hint" id="gstat"></p>
  <div id="flist" hidden></div>
  <div id="mlist" hidden></div>
  <div class="row">
    <button class="go" id="save">ذخیره</button>
    <button id="memb">حافظه</button>
    <button id="list">لیست مدل‌ها</button>
    <button id="reload">به‌روزرسانی مدل‌ها</button>
    <button id="close">بستن</button>
  </div>
</dialog>

<script>
const API='https://openrouter.ai/api/v1';
const $=id=>document.getElementById(id);
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
             set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let models=store.get('arya_models',[]);
let history=store.get('arya_hist',[]);
let busy=false;
const BASE='تو آریا هستی، یک دستیار هوشمند فارسی‌زبان. روان، دقیق و خلاصه به فارسی جواب بده.';
let SYS=BASE;
let mem={facts:store.get('arya_facts',[]),sha:null};
function setSys(){SYS=BASE+(mem.facts.length?'\nچیزهایی که کاربر خواسته یادت بمونه:\n- '+mem.facts.join('\n- '):'')}
async function ghReq(method,body){
  const tok=store.get('arya_gh',''),repo=store.get('arya_repo','');
  if(!tok||!repo)throw new Error('توکن یا ریپوی حافظه تو تنظیمات پر نشده');
  return fetch('https://api.github.com/repos/'+repo+'/contents/memory.json',{method,cache:'no-store',
    headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
}
async function memLoad(){
  const r=await ghReq('GET');
  if(r.status===404){
    const c=await fetch('https://api.github.com/repos/'+store.get('arya_repo',''),{headers:{Authorization:'Bearer '+store.get('arya_gh','')}});
    if(!c.ok)throw new Error('ریپو پیدا نشد یا توکن بهش دسترسی نداره');
    mem.sha=null;return;
  }
  if(!r.ok)throw new Error('خطای GitHub '+r.status);
  const j=await r.json();
  const d=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
  mem={facts:d.facts||[],sha:j.sha};store.set('arya_facts',mem.facts);setSys();
}
async function memSave(retry=1){
  store.set('arya_facts',mem.facts);
  const body={message:'update memory',content:btoa(unescape(encodeURIComponent(JSON.stringify({facts:mem.facts},null,1))))};
  if(mem.sha)body.sha=mem.sha;
  const r=await ghReq('PUT',body);
  if((r.status===409||r.status===422)&&retry){
    const g=await ghReq('GET');
    if(g.ok){
      const j=await g.json();
      const remote=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
      mem.sha=j.sha;
      mem.facts=[...new Set([...(remote.facts||[]),...mem.facts])];
      setSys();
      return memSave(0);
    }
  }
  const j=await r.json();
  if(!r.ok)throw new Error(j.message||('خطای GitHub '+r.status));
  mem.sha=j.content.sha;
}
function showFacts(){
  const box=$('flist');
  if(!box.hidden){box.hidden=true;return}
  box.innerHTML='';
  if(!mem.facts.length)box.textContent='هنوز چیزی یادم نیست. تو چت بنویس «یادت باشه ...».';
  mem.facts.forEach((f,i)=>{
    const d=document.createElement('div');
    const t=document.createElement('b');t.textContent=f;t.style.fontWeight='400';
    const x=document.createElement('span');x.textContent='✕';x.style.cursor='pointer';x.setAttribute('role','button');x.setAttribute('aria-label','حذف');
    x.onclick=async()=>{mem.facts.splice(i,1);setSys();try{await memSave()}catch(e){}box.hidden=true;showFacts()};
    d.append(t,x);box.appendChild(d);
  });
  box.hidden=false;
}

function fillModes(){
  const sel=$('mode'), cur=store.get('arya_mode','auto');
  sel.innerHTML='';
  const add=(v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)};
  add('auto','🔁 خودکار (با پشتیبان)');
  add('all','🧩 همه‌ی مدل‌ها (ترکیب)');
  add('code','💻 ساخت برنامه و بازی (تیمی)');
  models.forEach(m=>add(m.id,m.id.replace(':free','')));
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'auto';
}
async function loadModels(){
  try{
    const r=await fetch(API+'/models');const j=await r.json();
    models=(j.data||[]).filter(m=>{
      const free=m.id.endsWith(':free')||(m.pricing&&+m.pricing.prompt===0&&+m.pricing.completion===0);
      const out=m.architecture?.output_modalities||['text'];
      return free&&out.length===1&&out[0]==='text'&&!/router/i.test(m.id);
    }).sort((a,b)=>(b.context_length||0)-(a.context_length||0)).map(m=>({id:m.id,ctx:m.context_length||0}));
    store.set('arya_models',models);
  }catch(e){}
  $('mcount').textContent=models.length?models.length+' مدل رایگان پیدا شد.':'لیست مدل‌ها دریافت نشد. اینترنت رو چک کن.';
  fillModes();
}
async function ask(model,msgs,ms=45000,maxTok){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(API+'/chat/completions',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+store.get('arya_key','')},
      body:JSON.stringify(maxTok?{model,messages:msgs,max_tokens:maxTok}:{model,messages:msgs})});
    const j=await r.json();
    if(!r.ok||j.error){const em=j.error?.message||('خطا '+r.status);if(maxTok&&/token|length|context/i.test(em))return ask(model,msgs,ms);throw new Error(em)}
    const txt=j.choices?.[0]?.message?.content;
    if(!txt||!txt.trim())throw new Error('جواب خالی');
    return txt.trim();
  }finally{clearTimeout(t)}
}
function bubble(cls,text,note){
  const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
  if(note){const s=document.createElement('small');s.textContent=note;d.appendChild(s)}
  $('log').appendChild(d);$('log').scrollTop=1e9;return d;
}
function render(){
  const log=$('log');log.innerHTML='';
  if(!history.length){const e=document.createElement('div');e.className='empty';
    e.textContent='سلام! من آریام. هر چی میخوای بپرس. با حالت «خودکار» اگه یه مدل رایگان جواب نده، خودم میرم سراغ بعدی.';log.appendChild(e);return}
  history.forEach(m=>bubble(m.role==='user'?'me':'bot',m.content,m.model?'مدل: '+m.model:''));
  if(proj){const d=bubble('bot','آخرین پروژه‌ی ذخیره‌شده:');addActions(d,proj)}
}
async function autoAnswer(msgs){
  let last='';
  const list=models.slice(0,8);
  for(const m of list){
    try{return {text:await ask(m.id,msgs),model:m.id}}catch(e){last=e.message}
  }
  throw new Error(list.length?('هیچ مدلی جواب نداد. آخرین خطا: '+last):'لیست مدل‌ها خالیه. از تنظیمات به‌روزرسانی کن.');
}
async function allAnswer(msgs,q,status){
  const picks=models.slice(0,12).filter((_,i)=>i%2===0).slice(0,4);
  const res=await Promise.allSettled(picks.map(m=>ask(m.id,msgs).then(t=>({id:m.id,t}))));
  const ok=res.filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!ok.length)throw new Error('هیچ مدلی جواب نداد. چند دقیقه دیگه دوباره امتحان کن.');
  if(ok.length===1)return {text:ok[0].t,model:ok[0].id,parts:[]};
  status.firstChild.textContent='دارم جواب‌ها رو ترکیب میکنم...';
  const body='سوال کاربر:\n'+q+'\n\n'+ok.map((o,i)=>'جواب '+(i+1)+':\n'+o.t).join('\n\n')+
    '\n\nبا توجه به جواب‌های بالا، بهترین و دقیق‌ترین جواب نهایی رو به فارسی روان بنویس. تناقض‌ها رو حل کن و اشتباه‌ها رو حذف کن.';
  const syn=await autoAnswer([{role:'system',content:SYS},{role:'user',content:body}]);
  return {text:syn.text,model:'ترکیب '+ok.length+' مدل',parts:ok};
}
let proj=store.get('arya_proj','');
const FENCE='```';
function extractCode(t){
  let m=t.match(/```(?:html)?[ \t]*\n?([\s\S]*?)```/i);
  if(m&&m[1].trim())return m[1].trim();
  m=t.match(/```(?:html)?[ \t]*\n?([\s\S]*)$/i);
  if(m&&m[1].trim())return m[1].trim();
  if(/<!doctype html|<html/i.test(t))return t.trim();
  return null;
}
function codeScore(m){const id=m.id;let p=0;
  if(/coder/i.test(id))p+=40;
  if(/deepseek|qwen3|glm|kimi|gpt-oss|minimax|llama-3\.3|405b/i.test(id))p+=25;
  const b=id.match(/(\d+)b/i);if(b){const n=+b[1];p+=Math.min(n,500)/10-(n<=14?20:0)}
  if(/vl|vision|guard|embed|nano|mini|lite/i.test(id))p-=30;
  return p+Math.min(m.ctx||0,262144)/20000;
}
async function askCode(start,msgs,ms,maxTok){
  const list=[...models].sort((a,b)=>codeScore(b)-codeScore(a));
  const n=list.length;let last='';
  if(!n)throw new Error('لیست مدل‌ها خالیه. از تنظیمات به‌روزرسانی کن.');
  for(let k=0;k<Math.min(n,8);k++){
    const m=list[(start+k)%n];
    try{return {text:await ask(m.id,msgs,ms,maxTok),model:m.id}}catch(e){last=e.message}
  }
  throw new Error('هیچ مدلی جواب نداد. آخرین خطا: '+last);
}
const short=id=>id.split('/').pop().replace(':free','');
const IGN=/localStorage|sessionStorage|SecurityError|Script error|ResizeObserver|AudioContext|play\(\) failed|user gesture/i;
function testCode(code){
  return new Promise(res=>{
    const errs=[];
    const re=/<script([^>]*)>([\s\S]*?)<\/script>/gi;let m,i=0;
    while((m=re.exec(code))){
      i++;const a=m[1];
      if(/\bsrc\s*=/.test(a)||/type\s*=\s*["']?(?!text\/javascript|application\/javascript)/i.test(a))continue;
      try{new Function(m[2])}catch(e){errs.push('خطای نحوی در اسکریپت '+i+': '+e.message)}
    }
    if(!/<\/html>/i.test(code))errs.push('فایل ناقصه و وسط کار قطع شده (</html> نداره).');
    if(errs.length)return res(errs);
    const f=document.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts');
    f.style.cssText='position:fixed;left:-9999px;top:0;width:390px;height:700px;border:0';
    const tag='<script>(function(){var s=function(m){try{parent.postMessage({arya:1,m:String(m)},"*")}catch(e){}};window.addEventListener("error",function(e){s((e.message||"error")+(e.lineno?" (خط "+e.lineno+")":""))});window.addEventListener("unhandledrejection",function(e){s("Promise: "+(e.reason&&e.reason.message||e.reason))});var ce=console.error;console.error=function(){s([].join.call(arguments," "));ce.apply(console,arguments)}})()<\/script>';
    const h=ev=>{
      const d=ev.data;
      if(ev.source===f.contentWindow&&d&&d.arya&&!IGN.test(d.m)&&errs.length<5&&!errs.includes(d.m))errs.push(d.m);
    };
    window.addEventListener('message',h);
    setTimeout(()=>{window.removeEventListener('message',h);f.remove();res(errs)},3500);
    f.srcdoc=/<head[^>]*>/i.test(code)?code.replace(/<head[^>]*>/i,x=>x+tag):tag+code;
    document.body.appendChild(f);
  });
}
async function codeAnswer(q,status){
  const say=t=>{status.firstChild.textContent=t};
  const L=240000,MT=14000;
  const ctx=proj?'\n\nکد فعلی پروژه (همین رو ویرایش کن، از اول ننویس):\n'+FENCE+'html\n'+proj+'\n'+FENCE:'';
  const SYSC='تو برنامه‌نویس ارشد وب، سازنده‌ی بازی و طراح UI هستی. خروجی فقط یک فایل HTML کامل و قابل اجرا داخل یک بلاک '+FENCE+'html است و بعد از کد هیچ توضیحی نده.\n'+
  'قوانین فنی:\n'+
  '- هیچ کتابخانه، فونت، تصویر یا CDN خارجی نه. همه‌چیز آفلاین و توی همین فایل. گرافیک رو با Canvas 2D یا SVG یا CSS بساز: شخصیت‌ها و اشیا رو با شکل‌های هندسی، گرادیانت، سایه، glow، ذرات (particles)، ایموجی و انیمیشن بکش، نه با فایل تصویر.\n'+
  '- موبایل‌اول: تگ viewport، canvas تمام‌صفحه با devicePixelRatio و resize، کنترل لمسی (pointer/touch events) کنار کیبورد، دکمه‌های بزرگ، touch-action:none و user-select:none روی ناحیه‌ی بازی.\n'+
  '- بازی: حلقه‌ی requestAnimationFrame با deltaTime، وضعیت‌ها (menu/playing/paused/gameover)، امتیاز و رکورد (localStorage فقط داخل try/catch)، سختی تدریجی، افکت‌ها (لرزش صفحه، ذرات، انیمیشن)، صدای ساده با WebAudio (فقط بعد از اولین لمس) و دکمه‌ی خاموش/روشن.\n'+
  '- برنامه: رابط تمیز، رنگ‌ها با CSS variables، انیمیشن نرم، پشتیبانی از حالت تاریک، حالت‌های خالی و خطا.\n'+
  '- کیفیت بصری: پالت رنگ هماهنگ (حداکثر ۵ رنگ)، پس‌زمینه‌ی گرادیانتی، سایه و glow، گوشه‌های گرد، فاصله‌گذاری منظم، فونت system-ui. متن رابط فارسی و راست‌به‌چپ مگر کاربر چیز دیگه‌ای بخواد.\n'+
  '- کد باید کامل باشه: بدون TODO و placeholder. قبل از ارسال ذهنی چک کن همه‌ی متغیرها تعریف شدن و همه‌ی تگ‌ها و آکولادها بسته شدن. تابع‌ها رو ساده و تمیز نگه دار تا کد وسط راه قطع نشه.';
  say('۱: طراح داره ایده و نقشه رو میچینه...');
  const plan=await askCode(1,[{role:'system',content:'تو طراح ارشد بازی و محصول هستی. فقط یه نقشه‌ی کوتاه (حداکثر ۱۴ خط) به فارسی بده: ۱) نوع و ایده ۲) سبک بصری و پالت رنگ ۳) مکانیک‌ها و کنترل‌ها (لمس و کیبورد) ۴) افکت‌ها و صدا ۵) ساختار کد (توابع اصلی). کد ننویس. ایده رو جذاب و کامل ولی قابل پیاده‌سازی تو یک فایل نگه دار.'},{role:'user',content:q+ctx}],70000,1500);
  say('۲: برنامه‌نویس داره کد و گرافیک رو مینویسه (ممکنه چند دقیقه طول بکشه)...');
  const draft=await askCode(0,[{role:'system',content:SYSC},{role:'user',content:'درخواست: '+q+'\n\nنقشه:\n'+plan.text+ctx}],L,MT);
  let code=extractCode(draft.text);
  if(!code)throw new Error('مدل کد درست برنگردوند. دوباره امتحان کن.');
  say('تست خودکار کد...');
  let errs=await testCode(code);
  const used=[short(plan.model),short(draft.model)];
  let review={text:'',model:''},warn='';
  try{
    say('۳: بازبین داره کیفیت و گرافیک رو بررسی میکنه...');
    review=await askCode(2,[{role:'system',content:'تو بازبین ارشد بازی و برنامه‌ی وب هستی. کد رو بخون و حداکثر ۸ مورد کوتاه به فارسی بنویس: باگ‌های منطقی، چیزهای اجرانشدنی، نبودن کنترل لمسی، ویژگی‌های ناقص، و پیشنهاد مشخص برای جذاب‌تر شدن گرافیک (افکت، انیمیشن، ذرات، سایه، رنگ). کد ننویس.'},{role:'user',content:'درخواست کاربر: '+q+'\n\nکد:\n'+FENCE+'html\n'+code+'\n'+FENCE}],90000,1500);
    say('۴: برنامه‌نویس داره بهترش میکنه...');
    const imp=await askCode(0,[{role:'system',content:SYSC},{role:'user',content:'کد زیر رو طبق فهرست بازبینی بهتر کن و نسخه‌ی کامل رو بده. هر چیزی که کار میکرد رو خراب نکن.\n\nکد:\n'+FENCE+'html\n'+code+'\n'+FENCE+'\n\nفهرست بازبینی:\n'+review.text}],L,MT);
    const c2=extractCode(imp.text);
    if(c2&&c2.length>code.length*0.6){
      say('تست خودکار نسخه‌ی بهتر...');
      const e2=await testCode(c2);
      if(e2.length<=errs.length){code=c2;errs=e2;used.push(short(imp.model))}
    }
  }catch(e){warn+='\n⚠️ مرحله‌ی بازبینی یا بهبود انجام نشد ('+e.message+').'}
  for(let r=0;r<2&&errs.length;r++){
    try{
      say('۵: دارم خطاها رو رفع میکنم ('+(r+1)+' از ۲)...');
      const fx=await askCode(r,[{role:'system',content:SYSC},{role:'user',content:'این کد موقع اجرا این خطاها رو داره. دقیقاً همین‌ها رو رفع کن و نسخه‌ی کامل رو بده. اگه فایل وسط کار قطع شده، نسخه‌ی کامل و فشرده‌تر بنویس.\n\nخطاها:\n- '+errs.join('\n- ')+'\n\nکد:\n'+FENCE+'html\n'+code+'\n'+FENCE}],L,MT);
      const c3=extractCode(fx.text);
      if(!c3)continue;
      const e3=await testCode(c3);
      if(e3.length<errs.length){code=c3;errs=e3;used.push(short(fx.model))}
    }catch(e){warn+='\n⚠️ رفع خطا انجام نشد ('+e.message+').'}
  }
  proj=code;store.set('arya_proj',proj);
  const lines=code.split('\n').length;
  const st=errs.length?'\n⚠️ هنوز این خطاها ممکنه مونده باشه:\n- '+errs.join('\n- '):'\n✅ تست خودکار بدون خطا اجرا شد.';
  return {text:'پروژه آماده شد ('+lines+' خط). با ▶ اجرا امتحانش کن. برای تغییر یا اضافه کردن چیزی، همینجا بنویس.'+st+warn,
    model:'تیم: '+used.join(' ← '),
    parts:[{id:'نقشه',t:plan.text},{id:'بازبینی',t:review.text||'-'}],code};
}
function addActions(d,code){
  const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;margin-top:8px;flex-wrap:wrap';
  const mk=(t,fn)=>{const b=document.createElement('button');b.className='ic';b.textContent=t;b.onclick=fn;row.appendChild(b)};
  mk('▶ اجرا',()=>{$('pv').srcdoc=code;$('pvbox').hidden=false});
  mk('📋 کپی',async e=>{try{await navigator.clipboard.writeText(code);e.target.textContent='کپی شد ✅'}catch{e.target.textContent='کپی نشد'}});
  mk('⬇ دانلود',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/html'}));a.download='project.html';a.click()});
  d.appendChild(row);
}
$('pvx').onclick=()=>{$('pvbox').hidden=true;$('pv').srcdoc=''};
$('f').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;
  const q=$('q').value.trim();if(!q)return;
  const rm=q.match(/^(?:یادت باشه|یادت باشد|به خاطر بسپار)[\s:،,\-]*([\s\S]+)/);
  if(rm){
    busy=true;$('q').value='';$('q').style.height='auto';
    if(!history.length)$('log').innerHTML='';
    bubble('me',q);
    mem.facts.push(rm[1].trim());setSys();
    let note='یادم موند ✅';
    try{await memSave()}catch(err){note='تو همین مرورگر یادم موند، ولی تو GitHub ذخیره نشد: '+err.message}
    bubble('bot',note);busy=false;return;
  }
  if(!store.get('arya_key','')){$('dlg').showModal();return}
  busy=true;$('s').disabled=true;$('q').value='';$('q').style.height='auto';
  history.push({role:'user',content:q});
  if(history.length===1)$('log').innerHTML='';
  bubble('me',q);
  const status=bubble('bot','در حال فکر کردن...');
  const msgs=[{role:'system',content:SYS},...history.slice(-12).map(({role,content})=>({role,content}))];
  const mode=$('mode').value;
  try{
    let r;
    if(mode==='auto')r=await autoAnswer(msgs);
    else if(mode==='all')r=await allAnswer(msgs,q,status);
    else if(mode==='code')r=await codeAnswer(q,status);
    else r={text:await ask(mode,msgs),model:mode};
    history.push({role:'assistant',content:r.text,model:r.model});
    status.remove();
    const d=bubble('bot',r.text,'مدل: '+r.model);
    if(r.code)addActions(d,r.code);
    if(r.parts&&r.parts.length){
      const det=document.createElement('details');
      const sm=document.createElement('summary');sm.textContent=r.code?'دیدن نقشه و بازبینی':'دیدن جواب تک‌تک مدل‌ها';det.appendChild(sm);
      r.parts.forEach(p=>{const x=document.createElement('p');x.textContent=p.id+':\n'+p.t;det.appendChild(x)});
      d.appendChild(det);
    }
    store.set('arya_hist',history.slice(-40));
  }catch(err){
    status.className='msg bot err';status.textContent=err.message;history.pop();
  }
  busy=false;$('s').disabled=false;
});
$('q').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('mode').addEventListener('change',e=>store.set('arya_mode',e.target.value));
$('memb').onclick=showFacts;
$('cfg').onclick=()=>{$('key').value=store.get('arya_key','');$('gh').value=store.get('arya_gh','');$('repo').value=store.get('arya_repo','');$('gstat').textContent='';$('mcount').textContent=models.length?models.length+' مدل رایگان در دسترسه.':'';$('dlg').showModal()};
$('list').onclick=()=>{
  const box=$('mlist');
  if(!box.hidden){box.hidden=true;return}
  box.innerHTML='';
  if(!models.length){box.textContent='لیست خالیه. «به‌روزرسانی مدل‌ها» رو بزن.'}
  models.forEach(m=>{
    const d=document.createElement('div');
    const n=document.createElement('b');n.textContent=m.id.replace(':free','');n.style.fontWeight='400';
    const c=document.createElement('span');c.textContent=m.ctx?Math.round(m.ctx/1000)+'K':'';
    d.append(n,c);box.appendChild(d);
  });
  box.hidden=false;
};
$('close').onclick=()=>$('dlg').close();
$('save').onclick=async()=>{
  store.set('arya_key',$('key').value.trim());
  store.set('arya_gh',$('gh').value.trim());
  store.set('arya_repo',$('repo').value.trim());
  if($('gh').value.trim()&&$('repo').value.trim()){
    $('gstat').textContent='در حال اتصال به حافظه...';
    try{await memLoad();$('gstat').textContent='حافظه وصل شد ✅ ('+mem.facts.length+' مورد)'}
    catch(e){$('gstat').textContent='اتصال حافظه نشد: '+e.message;return}
  }
  $('dlg').close();
};
$('reload').onclick=()=>{$('mcount').textContent='در حال دریافت...';loadModels()};
$('clr').onclick=()=>{history=[];proj='';store.set('arya_hist',[]);store.set('arya_proj','');render()};
setSys();fillModes();render();loadModels();
if(store.get('arya_gh','')&&store.get('arya_repo',''))memLoad().catch(()=>{});
if(!store.get('arya_key',''))setTimeout(()=>$('dlg').showModal(),400);
</script>
