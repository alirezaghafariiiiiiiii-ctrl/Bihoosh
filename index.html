<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>آریا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f5;--panel:#fff;--ink:#0f1b2d;--mute:#5d6b7c;--line:#d3dde7;--accent:#0e8f86;--accent-ink:#fff;--me:#0f1b2d;--me-ink:#fff;--bot:#fff;--err:#b4342d}
@media(prefers-color-scheme:dark){:root{--bg:#0b1420;--panel:#122033;--ink:#e8eef5;--mute:#8fa1b5;--line:#233750;--accent:#2fc4b8;--accent-ink:#06201d;--me:#2fc4b8;--me-ink:#06201d;--bot:#122033;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;font-weight:800;margin:0;flex:0 0 auto}
header select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.ic{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:15px}
.ic:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:280px;line-height:1.9}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.9;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.me{align-self:flex-start;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-end;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.bot.err{color:var(--err)}
details{margin-top:8px;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
details summary{cursor:pointer;color:var(--mute)}
details p{margin:6px 0;white-space:pre-wrap}
form{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;font-size:15px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-height:120px}
.send{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.send:disabled{opacity:.5}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-weight:600;margin:12px 0 6px}
dialog input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
dialog .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
dialog .row button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
dialog .row .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#pvbox{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#pvbox[hidden]{display:none}
#pvbox button{margin:8px;align-self:flex-start}
#pv{flex:1;border:0;background:#fff;width:100%}
#flist{margin-top:10px;max-height:30vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.9}
#flist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line)}
#flist div:last-child{border-bottom:0}
#flist span{color:var(--err);flex:0 0 auto}
dialog{max-height:90vh;overflow-y:auto}
#mlist{margin-top:10px;max-height:38vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;direction:ltr;text-align:left;font-size:13px;line-height:1.9}
#mlist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line)}
#mlist div:last-child{border-bottom:0}
#mlist span{color:var(--mute);flex:0 0 auto}
.hint{color:var(--mute);font-size:13px;line-height:1.8;margin:6px 0 0}
.msg.bot .md{white-space:normal}.md p{margin:0 0 8px;white-space:pre-wrap}.md>:last-child{margin-bottom:0}.md h3,.md h4,.md h5,.md h6{margin:10px 0 6px;font-size:16px}.md ul,.md ol{margin:0 0 8px;padding-inline-start:22px}.md code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:1px 5px;border-radius:6px;direction:ltr;unicode-bidi:embed}.cb{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}.cbar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 8px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}.cbar button{border:0;background:none;color:var(--ink);font-size:12px;padding:4px 6px}.cb pre{margin:0;padding:10px;overflow-x:auto;direction:ltr;text-align:left;max-height:50vh}.cb pre code{background:none;padding:0;white-space:pre}.md a{color:var(--accent)}.md blockquote{margin:0 0 8px;padding:2px 10px;border-inline-start:3px solid var(--line);color:var(--mute);white-space:pre-wrap}.tw{overflow-x:auto;margin:0 0 8px}.md table{border-collapse:collapse;font-size:13px}.md th,.md td{border:1px solid var(--line);padding:4px 8px}.md hr{border:0;border-top:1px solid var(--line)}
#chip{padding:6px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--mute);cursor:pointer}#chip[hidden]{display:none}
.pvtop{display:flex;align-items:center;gap:8px}.pvtop .ic{margin:8px}.pvtop .hint{flex:1;margin:0}
#pvf{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}#pvf input{flex:1;min-width:0;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}#pvf button{margin:0;align-self:auto;padding:0 16px}
#lbody{margin-top:10px;max-height:55vh;overflow-y:auto}#lbody .li{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}#lbody .lt{flex:1;cursor:pointer;line-height:1.7;min-width:0;overflow-wrap:anywhere}#lbody small{display:block;color:var(--mute);font-size:12px}#lbody .ic{padding:4px 8px}
.tools{display:flex;gap:10px;margin-top:6px}.tools button{border:0;background:none;color:var(--mute);font-size:13px;padding:2px 4px}
form .ic{padding:0 10px}
@media(prefers-reduced-motion:no-preference){.msg{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header>
  <h1>آریا</h1>
  <select id="mode" aria-label="انتخاب مدل"></select>
  <button class="ic" id="chs" aria-label="گفتگوها">💬</button>
  <button class="ic" id="prj" aria-label="پروژه‌ها">📁</button>
  <button class="ic" id="cfg" aria-label="تنظیمات">⚙️</button>
  <button class="ic" id="clr" aria-label="گفتگوی جدید">➕</button>
</header>
<div id="log"></div>
<div id="chip" hidden></div>
<form id="f">
  <button type="button" class="ic" id="att" aria-label="پیوست">📎</button>
  <button type="button" class="ic" id="mic" aria-label="میکروفون">🎤</button>
  <input type="file" id="file" hidden accept="image/*,.txt,.md,.json,.csv,.html,.js,.py,.css">
  <textarea id="q" rows="1" placeholder="بپرس..." aria-label="پیام"></textarea>
  <button class="send" id="s" type="submit">ارسال</button>
</form>

<div id="pvbox" hidden>
  <div class="pvtop"><button class="ic" id="pvx">✕ بستن</button><span id="pverr" class="hint"></span><button class="ic" id="pvfix" hidden>🛠 خودکار درستش کن</button></div>
  <iframe id="pv" sandbox="allow-scripts allow-forms allow-modals" title="پیش‌نمایش پروژه"></iframe>
  <form id="pvf"><input id="pvq" placeholder="بگو چی عوض بشه..." autocomplete="off"><button class="send" id="pvs" type="submit">اعمال</button></form>
</div>

<dialog id="ldlg"><strong id="ltitle"></strong><div id="lbody"></div><div class="row" id="lrow"></div></dialog>

<dialog id="dlg">
  <strong>تنظیمات</strong>
  <label for="key">کلید API اُپن‌روتر</label>
  <input id="key" type="password" autocomplete="off" placeholder="sk-or-...">
  <p class="hint">کلید فقط توی همین مرورگر ذخیره میشه و جای دیگه‌ای فرستاده نمیشه (به جز خود اُپن‌روتر).</p>
  <label for="gh">توکن GitHub (برای حافظه)</label>
  <input id="gh" type="password" autocomplete="off" placeholder="github_pat_...">
  <label for="repo">ریپوی حافظه</label>
  <input id="repo" autocomplete="off" placeholder="username/Bihooshe-memory">
  <p class="hint">تو چت بنویس «یادت باشه ...» تا آریا ذخیره کنه.</p>
  <p class="hint" id="mcount"></p>
  <p class="hint" id="gstat"></p>
  <div id="flist" hidden></div>
  <div id="mlist" hidden></div>
  <div class="row">
    <button class="go" id="save">ذخیره</button>
    <button id="memb">حافظه</button>
    <button id="list">لیست مدل‌ها</button>
    <button id="reload">به‌روزرسانی مدل‌ها</button>
    <button id="close">بستن</button>
  </div>
</dialog>

<script>
const API='https://openrouter.ai/api/v1';
const $=id=>document.getElementById(id);
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
             set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let models=store.get('arya_models',[]);
let history=store.get('arya_hist',[]);
let busy=false;
let chats=store.get('arya_chats',null),curChat=store.get('arya_cur','');
if(!chats){chats=[{id:'c'+Date.now(),title:'گفتگوی جدید',hist:history,ts:Date.now()}];curChat=chats[0].id}
if(!chats.some(c=>c.id===curChat))curChat=chats[0].id;
history=chats.find(c=>c.id===curChat).hist;
const BASE='تو آریا هستی، یک دستیار هوشمند فارسی‌زبان. روان، دقیق و خلاصه به فارسی جواب بده.';
let SYS=BASE;
let mem={facts:store.get('arya_facts',[]),sha:null};
function setSys(){SYS=BASE+(mem.facts.length?'\nچیزهایی که کاربر خواسته یادت بمونه:\n- '+mem.facts.join('\n- '):'')}
async function ghReq(method,body){
  const tok=store.get('arya_gh',''),repo=store.get('arya_repo','');
  if(!tok||!repo)throw new Error('توکن یا ریپوی حافظه تو تنظیمات پر نشده');
  return fetch('https://api.github.com/repos/'+repo+'/contents/memory.json',{method,cache:'no-store',
    headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
}
async function memLoad(){
  const r=await ghReq('GET');
  if(r.status===404){
    const c=await fetch('https://api.github.com/repos/'+store.get('arya_repo',''),{headers:{Authorization:'Bearer '+store.get('arya_gh','')}});
    if(!c.ok)throw new Error('ریپو پیدا نشد یا توکن بهش دسترسی نداره');
    mem.sha=null;return;
  }
  if(!r.ok)throw new Error('خطای GitHub '+r.status);
  const j=await r.json();
  const d=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
  mem={facts:d.facts||[],sha:j.sha};store.set('arya_facts',mem.facts);setSys();
}
async function memSave(retry=1){
  store.set('arya_facts',mem.facts);
  const body={message:'update memory',content:btoa(unescape(encodeURIComponent(JSON.stringify({facts:mem.facts},null,1))))};
  if(mem.sha)body.sha=mem.sha;
  const r=await ghReq('PUT',body);
  if((r.status===409||r.status===422)&&retry){
    const g=await ghReq('GET');
    if(g.ok){
      const j=await g.json();
      const remote=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
      mem.sha=j.sha;
      mem.facts=[...new Set([...(remote.facts||[]),...mem.facts])];
      setSys();
      return memSave(0);
    }
  }
  const j=await r.json();
  if(!r.ok)throw new Error(j.message||('خطای GitHub '+r.status));
  mem.sha=j.content.sha;
}
function showFacts(){
  const box=$('flist');
  if(!box.hidden){box.hidden=true;return}
  box.innerHTML='';
  if(!mem.facts.length)box.textContent='هنوز چیزی یادم نیست. تو چت بنویس «یادت باشه ...».';
  mem.facts.forEach((f,i)=>{
    const d=document.createElement('div');
    const t=document.createElement('b');t.textContent=f;t.style.fontWeight='400';
    const x=document.createElement('span');x.textContent='✕';x.style.cursor='pointer';x.setAttribute('role','button');x.setAttribute('aria-label','حذف');
    x.onclick=async()=>{mem.facts.splice(i,1);setSys();try{await memSave()}catch(e){}box.hidden=true;showFacts()};
    d.append(t,x);box.appendChild(d);
  });
  box.hidden=false;
}

function fillModes(){
  const sel=$('mode'), cur=store.get('arya_mode','auto');
  sel.innerHTML='';
  const add=(v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)};
  add('auto','🔁 خودکار (با پشتیبان)');
  add('all','🧩 همه‌ی مدل‌ها (ترکیب)');
  add('code','💻 ساخت برنامه و بازی (تیمی)');
  models.forEach(m=>add(m.id,m.id.replace(':free','')));
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'auto';
}
async function loadModels(){
  try{
    const r=await fetch(API+'/models');const j=await r.json();
    models=(j.data||[]).filter(m=>{
      const free=m.id.endsWith(':free')||(m.pricing&&+m.pricing.prompt===0&&+m.pricing.completion===0);
      const out=m.architecture?.output_modalities||['text'];
      return free&&out.length===1&&out[0]==='text'&&!/router/i.test(m.id);
    }).sort((a,b)=>(b.context_length||0)-(a.context_length||0)).map(m=>({id:m.id,ctx:m.context_length||0,vis:(m.architecture?.input_modalities||[]).includes('image')}));
    store.set('arya_models',models);
  }catch(e){}
  $('mcount').textContent=models.length?models.length+' مدل رایگان پیدا شد.':'لیست مدل‌ها دریافت نشد. اینترنت رو چک کن.';
  fillModes();
}
async function ask(model,msgs,ms=45000,maxTok){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(API+'/chat/completions',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+store.get('arya_key','')},
      body:JSON.stringify(maxTok?{model,messages:msgs,max_tokens:maxTok}:{model,messages:msgs})});
    const j=await r.json();
    if(!r.ok||j.error){const em=j.error?.message||('خطا '+r.status);if(maxTok&&/token|length|context/i.test(em))return ask(model,msgs,ms);throw new Error(em)}
    const txt=j.choices?.[0]?.message?.content;
    if(!txt||!txt.trim())throw new Error('جواب خالی');
    return txt.trim();
  }finally{clearTimeout(t)}
}
let curCtl=null,stopped=false;
const stick=()=>{const l=$('log');if(l.scrollHeight-l.scrollTop-l.clientHeight<140)l.scrollTop=l.scrollHeight};
async function askStream(model,msgs,onDelta,ms=45000){
  const ctl=new AbortController();curCtl=ctl;
  let t=setTimeout(()=>ctl.abort(),ms),txt='';
  try{
    const r=await fetch(API+'/chat/completions',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+store.get('arya_key','')},
      body:JSON.stringify({model,messages:msgs,stream:true})});
    if(!r.ok){let em='خطا '+r.status;try{const j=await r.json();em=j.error?.message||em}catch{}throw new Error(em)}
    if(!r.body||!r.body.getReader||/application\/json/i.test(r.headers.get('content-type')||'')){
      const j=await r.json();
      if(j.error)throw new Error(j.error.message||'خطا');
      const x=j.choices?.[0]?.message?.content;
      if(!x||!x.trim())throw new Error('جواب خالی');
      onDelta(x.trim());return x.trim();
    }
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    try{
      for(;;){
        const {done,value}=await rd.read();if(done)break;
        clearTimeout(t);t=setTimeout(()=>ctl.abort(),30000);
        buf+=dec.decode(value,{stream:true});
        let i;
        while((i=buf.indexOf('\n'))>=0){
          const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
          if(!line.startsWith('data:'))continue;
          const d=line.slice(5).trim();if(d==='[DONE]')continue;
          let j;try{j=JSON.parse(d)}catch{continue}
          if(j.error)throw new Error(j.error.message||'خطا');
          const c=j.choices?.[0]?.delta?.content;
          if(c){txt+=c;onDelta(txt)}
        }
      }
    }catch(e){
      if(stopped&&txt.trim())return txt.trim();
      throw e;
    }
    if(!txt.trim())throw new Error('جواب خالی');
    return txt.trim();
  }finally{clearTimeout(t);if(curCtl===ctl)curCtl=null}
}
function inl(el,s){
  const re=/(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*)|(\[[^\]\n]+\]\(https?:\/\/[^\s)]+\))/g;
  let i=0,m;
  while((m=re.exec(s))){
    if(m.index>i)el.append(s.slice(i,m.index));
    const t=m[0];let n;
    if(t[0]==='`'){n=document.createElement('code');n.textContent=t.slice(1,-1)}
    else if(t.startsWith('**')){n=document.createElement('b');n.textContent=t.slice(2,-2)}
    else if(t[0]==='*'){n=document.createElement('i');n.textContent=t.slice(1,-1)}
    else{const k=t.indexOf('](');n=document.createElement('a');n.textContent=t.slice(1,k);n.href=t.slice(k+2,-1);n.target='_blank';n.rel='noopener noreferrer'}
    el.append(n);i=m.index+t.length;
  }
  if(i<s.length)el.append(s.slice(i));
}
function codeBlock(root,code,lang){
  const w=document.createElement('div');w.className='cb';
  const bar=document.createElement('div');bar.className='cbar';
  const lb=document.createElement('span');lb.textContent=lang||'code';bar.appendChild(lb);
  const mk=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;bar.appendChild(b)};
  mk('📋 کپی',async e=>{try{await navigator.clipboard.writeText(code);e.target.textContent='کپی شد ✅'}catch{e.target.textContent='کپی نشد'}});
  if(lang==='html'&&/<html|<!doctype|<body|<canvas|<script/i.test(code))mk('▶ اجرا',()=>openPv(code));
  const pre=document.createElement('pre');const c=document.createElement('code');c.textContent=code;pre.appendChild(c);
  w.append(bar,pre);root.appendChild(w);
}
function renderMd(root,src){
  root.textContent='';
  const lines=src.replace(/\r/g,'').split('\n');
  let i=0,para=[];
  const add=(tag,txt)=>{const e=document.createElement(tag);inl(e,txt);root.appendChild(e);return e};
  const flush=()=>{if(para.length){add('p',para.join('\n'));para=[]}};
  const isLi=l=>/^\s*[-*•]\s+/.test(l)||/^\s*\d+[.)]\s+/.test(l);
  while(i<lines.length){
    const l=lines[i];let m;
    if((m=l.match(/^```\s*([\w+-]*)/))){
      flush();const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);
      i++;codeBlock(root,buf.join('\n'),m[1].toLowerCase());continue;
    }
    if((m=l.match(/^(#{1,4})\s+(.+)/))){flush();add('h'+(m[1].length+2),m[2]);i++;continue}
    if(/^\s*([-*_])\1{2,}\s*$/.test(l)){flush();root.appendChild(document.createElement('hr'));i++;continue}
    if(isLi(l)){
      flush();const ul=document.createElement(/^\s*\d/.test(l)?'ol':'ul');
      while(i<lines.length&&isLi(lines[i])){
        const li=document.createElement('li');inl(li,lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/,''));ul.appendChild(li);i++;
      }
      root.appendChild(ul);continue;
    }

function openPv(code){
  pvCode=code;pvErrs=[];$('pverr').textContent='';$('pvfix').hidden=true;
  $('pv').srcdoc=/<head[^>]*>/i.test(code)?code.replace(/<head[^>]*>/i,x=>x+HOOK):HOOK+code;
  $('pvbox').hidden=false;
}
window.addEventListener('message',ev=>{
  const d=ev.data;
  if(ev.source===$('pv').contentWindow&&d&&d.arya&&!IGN.test(d.m)&&pvErrs.length<5&&!pvErrs.includes(d.m)){
    pvErrs.push(d.m);$('pverr').textContent='⚠️ '+pvErrs.length+' خطا';$('pvfix').hidden=false;
  }
});
async function codeEdit(base,instr,errs,say){
  const mk=(i,e,c)=>(e.length?'این کد موقع اجرا این خطاها رو داره. رفعشون کن:\n- '+e.join('\n- ')+'\n\n':'')+(i?'تغییر درخواستی کاربر: '+i+'\n\n':'')+'نسخه‌ی کامل کد رو بده. چیزی که کار میکرد رو خراب نکن. اگه فایل وسط کار قطع شده، نسخه‌ی کامل و فشرده‌تر بنویس.\n\nکد:\n'+FENCE+'html\n'+c+'\n'+FENCE;
  let cur=base,ce=errs||[],ok=false;
  for(let r=0;r<2;r++){
    say(r?'رفع خطاهای تازه...':'در حال اعمال تغییر...');
    const o=await askCode(r,[{role:'system',content:SYSC},{role:'user',content:mk(r?'':instr,ce,cur)}],240000,14000);
    const c=extractCode(o.text);if(!c)continue;
    const e=await testCode(c);
    if(r===0||e.length<ce.length){cur=c;ce=e;ok=true}
    if(!e.length)break;
  }
  if(!ok)throw new Error('مدل کد درست برنگردوند');
  return {code:cur,errs:ce};
}
async function pvApply(instr,errs){
  if(pvBusy||!pvCode)return;
  pvBusy=true;$('pvs').disabled=true;$('pvfix').disabled=true;
  try{
    const r=await codeEdit(pvCode,instr,errs,t=>{$('pverr').textContent=t});
    saveProject(r.code,instr||'پروژه',(instr||'رفع خطا').slice(0,30));
    $('pvq').value='';openPv(r.code);render();
  }catch(e){$('pverr').textContent='خطا: '+e.message}
  pvBusy=false;$('pvs').disabled=false;$('pvfix').disabled=false;
}
$('pvf').addEventListener('submit',e=>{e.preventDefault();const q=$('pvq').value.trim();if(q)pvApply(q,[])});
$('pvfix').onclick=()=>pvApply('',pvErrs.slice());
function speak(t){
  const sy=window.speechSynthesis;if(!sy)return;
  if(sy.speaking){sy.cancel();return}
  const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' کد ').replace(/[*#`>|]/g,'').slice(0,3000));u.lang='fa-IR';sy.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(!SR)$('mic').hidden=true;
$('mic').onclick=()=>{
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='fa-IR';rec.interimResults=true;rec.continuous=false;
  const base=$('q').value;
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;$('q').value=(base?base+' ':'')+t;$('q').dispatchEvent(new Event('input'))};
  rec.onend=()=>{rec=null;$('mic').textContent='🎤'};
  rec.onerror=()=>{};
  $('mic').textContent='⏹';rec.start();
};
let att=null,visionReq=false;
$('att').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    if(f.type.startsWith('image/')){
      const bm=await createImageBitmap(f);const k=Math.min(1,1024/Math.max(bm.width,bm.height));
      const cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
      cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
      att={type:'img',name:f.name,url:cv.toDataURL('image/jpeg',.8)};
    }else att={type:'txt',name:f.name,text:(await f.text()).slice(0,30000)};
    $('chip').textContent=(att.type==='img'?'🖼️ ':'📎 ')+att.name+'  ✕';$('chip').hidden=false;
  }catch(err){att=null;bubble('bot err','فایل خونده نشد.')}
};
$('chip').onclick=()=>{att=null;$('chip').hidden=true};
$('chs').onclick=showChats;$('prj').onclick=showProjects;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

$('f').addEventListener('submit',async e=>{
  e.preventDefault();if(busy){if(curCtl){stopped=true;curCtl.abort()}return}
  const q=$('q').value.trim();if(!q)return;
  const rm=q.match(/^(?:یادت باشه|یادت باشد|به خاطر بسپار)[\s:،,\-]*([\s\S]+)/);
  if(rm){
    busy=true;$('q').value='';$('q').style.height='auto';
    if(!history.length)$('log').innerHTML='';
    bubble('me',q);
    mem.facts.push(rm[1].trim());setSys();
    let note='یادم موند ✅';
    try{await memSave()}catch(err){note='تو همین مرورگر یادم موند، ولی تو GitHub ذخیره نشد: '+err.message}
    bubble('bot',note);busy=false;return;
  }
  if(!store.get('arya_key','')){$('dlg').showModal();return}
  busy=true;stopped=false;curCtl=null;$('q').value='';$('q').style.height='auto';
  history.push({role:'user',content:q+(att?(att.type==='img'?' 🖼️':' 📎'+att.name):'')});
  if(history.length===1)$('log').innerHTML='';
  bubble('me',q);
  const status=bubble('bot','در حال فکر کردن...');
  const msgs=[{role:'system',content:SYS},...history.slice(-12).map(({role,content})=>({role,content}))];
  const mode=$('mode').value;
  const a=att;att=null;$('chip').hidden=true;
  const useAtt=a&&mode!=='all'&&mode!=='code';
  if(a&&!useAtt)bubble('bot','پیوست فقط تو حالت «خودکار» یا یه مدل مشخص استفاده میشه.');
  if(useAtt){const last=msgs[msgs.length-1];last.content=a.type==='img'?[{type:'text',text:q},{type:'image_url',image_url:{url:a.url}}]:q+'\n\n[فایل '+a.name+']\n'+a.text}
  visionReq=!!(useAtt&&a.type==='img');
  const canStop=mode!=='all'&&mode!=='code';
  if(canStop)$('s').textContent='توقف';else $('s').disabled=true;
  const onDelta=t=>{if(!status._md){status.textContent='';status._md=document.createElement('div');status._md.className='md';status.appendChild(status._md)}renderMd(status._md,t);stick()};
  try{
    let r;
    if(mode==='auto')r=await autoAnswer(msgs,onDelta);
    else if(mode==='all')r=await allAnswer(msgs,q,status);
    else if(mode==='code')r=await codeAnswer(q,status);
    else r={text:await askStream(mode,msgs,onDelta),model:mode};
    history.push({role:'assistant',content:r.text,model:r.model});
    status.remove();
    const d=bubble('bot',r.text,'مدل: '+r.model,true);
    if(r.code)addActions(d,r.code);
    if(r.parts&&r.parts.length){
      const det=document.createElement('details');
      const sm=document.createElement('summary');sm.textContent=r.code?'دیدن نقشه و بازبینی':'دیدن جواب تک‌تک مدل‌ها';det.appendChild(sm);
      r.parts.forEach(p=>{const x=document.createElement('p');x.textContent=p.id+':\n'+p.t;det.appendChild(x)});
      d.appendChild(det);
    }
    saveHist();
  }catch(err){
    status.className='msg bot err';status.textContent=err.message;history.pop();
  }
  busy=false;$('s').disabled=false;$('s').textContent='ارسال';
});
$('q').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('mode').addEventListener('change',e=>store.set('arya_mode',e.target.value));
$('memb').onclick=showFacts;
$('cfg').onclick=()=>{$('key').value=store.get('arya_key','');$('gh').value=store.get('arya_gh','');$('repo').value=store.get('arya_repo','');$('gstat').textContent='';$('mcount').textContent=models.length?models.length+' مدل رایگان در دسترسه.':'';$('dlg').showModal()};
$('list').onclick=()=>{
  const box=$('mlist');
  if(!box.hidden){box.hidden=true;return}
  box.innerHTML='';
  if(!models.length){box.textContent='لیست خالیه. «به‌روزرسانی مدل‌ها» رو بزن.'}
  models.forEach(m=>{
    const d=document.createElement('div');
    const n=document.createElement('b');n.textContent=m.id.replace(':free','');n.style.fontWeight='400';
    const c=document.createElement('span');c.textContent=m.ctx?Math.round(m.ctx/1000)+'K':'';
    d.append(n,c);box.appendChild(d);
  });
  box.hidden=false;
};
$('close').onclick=()=>$('dlg').close();
$('save').onclick=async()=>{
  store.set('arya_key',$('key').value.trim());
  store.set('arya_gh',$('gh').value.trim());
  store.set('arya_repo',$('repo').value.trim());
  if($('gh').value.trim()&&$('repo').value.trim()){
    $('gstat').textContent='در حال اتصال به حافظه...';
    try{await memLoad();$('gstat').textContent='حافظه وصل شد ✅ ('+mem.facts.length+' مورد)'}
    catch(e){$('gstat').textContent='اتصال حافظه نشد: '+e.message;return}
  }
  $('dlg').close();
};
$('reload').onclick=()=>{$('mcount').textContent='در حال دریافت...';loadModels()};
$('clr').onclick=newChat;
setSys();fillModes();render();loadModels();
if(store.get('arya_gh','')&&store.get('arya_repo',''))memLoad().catch(()=>{});
if(!store.get('arya_key',''))setTimeout(()=>$('dlg').showModal(),400);
</script>
</body>
